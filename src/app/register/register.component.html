<div class="auth-container">
  <h2>Register</h2>
  <form (ngSubmit)="onSubmit($event)">
    <mat-form-field appearance="fill">
      <mat-label>Username</mat-label>
      <input matInput type="text" [(ngModel)]="registrationData.username" name="username" required>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Password</mat-label>
      <input matInput type="password" [(ngModel)]="registrationData.password" name="password" required>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Full Name</mat-label>
      <input matInput type="text" [(ngModel)]="registrationData.fullName" name="fullName" required>
    </mat-form-field>

    <!-- Use a standard input for file upload -->
    <div class="file-upload">
      <label for="photo" class="file-upload-label">Choose a Photo</label>
      <input type="file" id="photo" (change)="onFileSelected($event)" class="file-upload-input">
    </div>

    <button mat-raised-button color="primary" type="submit">Register</button>
  </form>
  <button mat-button (click)="switchToLogin()">Switch to Login</button>
</div>
